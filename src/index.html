<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>IP Adresim</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --text-primary: #111111;
      --text-secondary: #888888;
      --btn-bg: #e8e8e8;
      --btn-hover: #dcdcdc;
    }

    [data-theme="dark"] {
      --bg: #0f0f0f;
      --text-primary: #f0f0f0;
      --text-secondary: #666666;
      --btn-bg: #1f1f1f;
      --btn-hover: #2a2a2a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }

    .toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--btn-bg);
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      transition: background 0.15s;
    }

    .toggle:hover { background: var(--btn-hover); }

    p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #ip {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    #copyBtn {
      background: var(--btn-bg);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: background 0.15s;
    }

    #copyBtn:hover { background: var(--btn-hover); }
  </style>
</head>
<body>
  <button class="toggle" id="themeToggle">🌙</button>

  <p>IP Adresin</p>
  <div id="ip">…</div>
  <button id="copyBtn">Kopyala</button>

  <script>
    const toggle = document.getElementById('themeToggle');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      toggle.textContent = dark ? '☀️' : '🌙';
    }

    const saved = localStorage.getItem('theme');
    applyTheme(saved ? saved === 'dark' : prefersDark.matches);

    toggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      applyTheme(!isDark);
    });

    prefersDark.addEventListener('change', e => {
      if (!localStorage.getItem('theme')) applyTheme(e.matches);
    });

    fetch('/api/ip')
      .then(r => r.json())
      .then(d => {
        document.getElementById('ip').textContent = d.ip;
        document.getElementById('copyBtn').addEventListener('click', () => {
          navigator.clipboard.writeText(d.ip).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = 'Kopyalandı!';
            setTimeout(() => btn.textContent = 'Kopyala', 2000);
          });
        });
      });
  </script>
</body>
</html>
